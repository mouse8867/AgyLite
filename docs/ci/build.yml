name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Hash
        shell: pwsh
        run: |
          $f = "target/x86_64-pc-windows-msvc/release/agylite.exe"
          Copy-Item $f AgyLite.exe
          (Get-FileHash AgyLite.exe -Algorithm SHA256).Hash | Out-File AgyLite.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AgyLite-windows
          path: |
            AgyLite.exe
            AgyLite.exe.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AgyLite.exe
            AgyLite.exe.sha256
